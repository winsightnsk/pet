<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 400px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 5em;
            margin-bottom: 20px;
            color: #667eea;
        }

        .info-box {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
        }

        .info-item {
            margin: 10px 0;
            padding: 5px 0;
            border-bottom: 1px dashed #dee2e6;
        }
        
        .opponents-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .opponent-item {
            margin: 8px 0;
            padding: 8px;
            background-color: #f8f9fa;
            border-radius: 8px;
            transition: background-color 0.2s ease;
        }
        
        .opponent-item:hover {
            background-color: #e9ecef;
        }

        .info-label {
            font-weight: bold;
            color: #495057;
            display: inline-block;
            width: 120px;
        }

        .info-value {
            color: #6c757d;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            margin-top: 20px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 14px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: translateY(0);
        }

        .logout {
            color: #dc3545;
            text-decoration: none;
            display: block;
            margin-top: 15px;
            font-size: 14px;
        }

        .logout:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">👤</div>
    <h1>Кабинет</h1>

    <div class="info-box">
        <div class="info-item">
            <span class="info-label">Имя:</span>
            <span class="info-value" th:text="${hh.name}"></span>
        </div>
    </div>

    <div class="info-box">
        <th:block th:if="${#lists.isEmpty(oppList)}">
            <div class="info-item">Нет доступных соперников</div>
        </th:block>
        <th:block th:if="${!#lists.isEmpty(oppList)}">
            <ul class="opponents-list">
                <li th:each="opponent : ${oppList}" class="opponent-item" th:if="${opponent != null}">
                    <a th:href="@{'/game/opponent/join/' + ${opponent.id}}"
                       class="info-value"
                       th:text="${opponent.name}"></a>
                </li>
            </ul>
        </th:block>
    </div>

    <form action="/xo/auth/" method="get">
        <button type="submit">Назад</button>
    </form>
    <a class="logout" href="/xo/logout">Выйти</a>
</div>
</body>
</html>
