<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Крестики-нолики - Игра</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 450px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.2em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .game-info {
            margin-bottom: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 10px;
            color: #495057;
        }

        .status {
            font-size: 1.2em;
            font-weight: bold;
            margin: 10px 0;
        }

        .current-player {
            color: #667eea;
        }

        .game-over {
            color: #e74c3c;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 30px auto;
            width: 300px;
            aspect-ratio: 1;
        }

        .board a {
            text-decoration: none;
            display: block;
            width: 100%;
            height: 100%;
        }

        .cell {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            height: 100%;
            aspect-ratio: 1;
            box-sizing: border-box;
        }

        .cell:hover {
            background: #e9ecef;
            transform: scale(1.05);
        }

        .cell.x {
            color: #e74c3c;
        }

        .cell.o {
            color: #3498db;
        }

        .cell.empty {
            color: #6c757d;
        }

        .cell.disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .cell.disabled:hover {
            transform: none;
        }

        .controls {
            margin-top: 30px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 0 10px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 14px rgba(0, 0, 0, 0.2);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid #667eea;
            color: #667eea;
        }

        .btn-outline:hover {
            background: #667eea;
            color: white;
        }

        .controls a {
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Крестики-нолики</h1>

    <div class="game-info">
        <div>❌: <strong th:text="${xName}"></strong></div>
        <div>⭕: <strong th:text="${oName != null} ? ${oName} : 'AI'"></strong></div>
        <div class="status" th:if="${gameOver}">
            <span class="game-over" th:text="${message}"></span>
        </div>
        <div class="status" th:unless="${gameOver}">
            Ход: <span class="current-player" th:text="${turn}"></span>
        </div>
    </div>

    <div class="board">
        <th:block th:each="cell, iter : ${cells}">
            <th:block th:switch="${cell}">
                <div class="cell x" th:case="'X'">❌</div>
                <div class="cell o" th:case="'O'">⭕</div>
                <th:block th:case="*">
                    <a th:href="${!gameOver} ? @{'/turn/' + ${iter.index} + '/' + ${gameId}} : '#'"
                       th:style="${gameOver} ? 'cursor: default; pointer-events: none;' : ''">
                        <div class="cell empty" th:classappend="${gameOver} ? 'disabled' : ''">&nbsp;</div>
                    </a>
                </th:block>
            </th:block>
        </th:block>
    </div>

    <div class="controls">
        <a th:href="@{'/'}">
            <button class="btn btn-outline">Назад</button>
        </a>
        <a th:href="@{'/game/new/ai'}">
            <button class="btn btn-outline" th:if="${gameOver}">Новая игра</button>
        </a>
    </div>

    <!-- Отображение сообщения после хода -->
    <th:block th:if="${message} and ${!gameOver}">
        <div style="margin-top: 20px; color: #27ae60; font-weight: bold;" th:text="${message}"></div>
    </th:block>
</div>
</body>
</html>
