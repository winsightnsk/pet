<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Крестики-нолики</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 400px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 5em;
            margin-bottom: 20px;
            color: #667eea;
        }

        form {
            margin-top: 20px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            margin-top: 20px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 14px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: translateY(0);
        }

        .error-message {
            color: #e74c3c;
            font-size: 14px;
            margin: 10px 0;
            padding: 10px;
            background-color: #fadbd8;
            border-radius: 5px;
            display: block;
        }

        .features {
            margin-top: 30px;
            text-align: left;
            color: #666;
            font-size: 14px;
        }

        .features li {
            margin: 10px 0;
            padding-left: 20px;
            position: relative;
        }

        .features li:before {
            content: "✓";
            color: #667eea;
            position: absolute;
            left: 0;
            font-weight: bold;
        }

        .cell-tag {
            background: linear-gradient(90deg, #667eea, #764ba2);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 1rem;
            text-decoration: none;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">❌⭕</div>
    <h1>Крестики-нолики</h1>

    <form action="/xo/new/" method="post">
        <input type="text"
               name="playerName"
               placeholder="Введите имя"
               required
               maxlength="100"
               autofocus>
        <input type="password"
               name="playerPassword"
               placeholder="Введите пароль"
               required
               maxlength="50"
               autofocus>
        <button type="submit">Авторизовать или создать игрока</button>

        <!-- Отображение сообщения об ошибке, если оно есть -->
        <th:block th:if="${error}">
            <span class="error-message" th:text="${error}"></span>
        </th:block>
    </form>

    <div class="existing-players">
        <h3>Выбрать игрока:</h3>
        <div class="cell-list">
            <th:block th:if="${#lists.size(playerList)>0}">
                <div class="cell-tag"
                     th:each="existingPlayer : ${playerList}">
                    <a href="#"
                       th:data-playername="${existingPlayer}"
                       th:text="${existingPlayer}"
                       onclick="fillPlayerName(this); return false;"></a>
                </div>
            </th:block>
            <th:block th:if="${#lists.isEmpty(playerList)}">
                <div class="cell-tag">Нет других сохраненных игроков</div>
            </th:block>
        </div>
    </div>

    <ul class="features">
        <li>Ваш прогресс сохраняется автоматически</li>
    </ul>

    <script>
        function fillPlayerName(element) {
            var playerName = element.getAttribute('data-playername');
            var nameInput = document.querySelector('input[name="playerName"]');
            var passwordInput = document.querySelector('input[name="playerPassword"]');

            if (nameInput) {
                nameInput.value = playerName;
            }
            if (passwordInput) {
                passwordInput.value = '';
            }
        }
    </script>

</div>
</body>
</html>
